# Config for the operator GUI (app.py / ui/main_window.py). Separate from
# config.py, which is the Phase 1 camera-only viewer (main.py, tune_hsv.py)
# and is untouched by this file.

stream:
  url: "http://192.168.0.52:4747/video/640x480"
  retry_backoff_base_s: 1.0
  retry_backoff_max_s: 30.0

detection:
  hsv:
    lower: [100, 150, 50]
    upper: [140, 255, 255]
  min_contour_area: 500
  label: blue_object

# mode: mock | udp. mock needs nothing else and is the primary path while
# no hardware exists -- see udp below for when real hardware shows up.
link:
  mode: mock
  udp:
    robot_host: "192.168.0.50"
    robot_port: 9000
    listen_port: 9001

tracker:
  dead_zone: 0.1
  turn_gain: 0.8
  turn_speed: 30.0
  lost_target_hold_s: 0.3

ui:
  tick_interval_s: 0.033
  window_width: 640
  window_height: 480

# Bench Test tab. dwell_timeout_s must stay well under bench_arm_timeout_s
# (transport/constants.yaml) or bench mode can auto-disarm while a servo
# is held away from neutral, before the dwell guard ever gets to fire --
# app.py's BenchTab warns at startup if this is violated.
bench:
  dwell_timeout_s: 8.0
  nudge_step_us: 10
  default_sweep_min_us: 1400
  default_sweep_max_us: 1600
  default_sweep_duration_s: 4.0
