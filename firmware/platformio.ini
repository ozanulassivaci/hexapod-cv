; hexapod-cv firmware. See docs/protocol.md and reference/ANALYSIS.md before
; touching anything in lib/core -- that's where the safety-relevant pure
; logic (watchdog, dwell guard, arm gates, protocol codec) lives, and it's
; deliberately hardware-free so it can be unit tested on the host, same
; principle the Python side applies everywhere (CLAUDE.md).
;
; Two environments:
;   native                 -- host GCC, no ESP32 involved. `pio test -e native`
;                              runs lib/core's Unity tests on this machine.
;                              This is the primary verification loop while
;                              developing: fast, no hardware required.
;   esp32-s3-devkitc-1      -- the real target. `pio run` compiles the full
;                              firmware, including the ESP32-only hardware
;                              layer (src/) that native can't build.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<*>
build_flags = -Iinclude
lib_ldf_mode = deep+
lib_deps =
    SPI
    Wire
    bblanchon/ArduinoJson @ 7.2.1
    adafruit/Adafruit PWM Servo Driver Library @ 3.0.2

[env:native]
platform = native
build_src_filter = -<*>
build_flags = -Iinclude -std=gnu++17
lib_deps =
    bblanchon/ArduinoJson @ 7.2.1
